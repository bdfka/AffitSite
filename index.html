<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AffitCrash — Лицензия</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
        --bg: #0A0818; --panel: #1A1730; --panel-2: #232042;
        --accent: #5B6CFF; --accent-p: #9D4EDD;
        --hover: #7B8BFF; --hover-p: #B56FEE;
        --text: #FFFFFF; --text-dim: #B8B4D6; --border: #3D3870;
        --success: #3AD68A; --error: #FF5C7A; --warn: #FFB84C;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text);
        font-family: 'Inter', sans-serif; overflow-x: hidden; }

    .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.45;
        animation: float 20s ease-in-out infinite; }
    .b1 { width: 500px; height: 500px; background: var(--accent); top: -150px; left: -150px; }
    .b2 { width: 600px; height: 600px; background: var(--accent-p); bottom: -200px; right: -200px; animation-delay: -8s; }
    @keyframes float { 0%,100% { transform: translate(0,0) } 50% { transform: translate(80px,-60px) } }

    .screen { position: absolute; inset: 0; display: flex; align-items: center;
        justify-content: center; padding: 20px; z-index: 2;
        opacity: 0; pointer-events: none; transition: all 0.4s; }
    .screen.active { opacity: 1; pointer-events: all; }

    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 20px;
        padding: 32px; width: 100%; max-width: 420px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.6); position: relative; overflow: hidden; }
    .panel::before { content: ''; position: absolute; top: 0; left: 10%; right: 10%; height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent), var(--accent-p), transparent); }

    .logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }
    .logo-icon { width: 40px; height: 40px;
        background: linear-gradient(135deg, var(--accent), var(--accent-p));
        border-radius: 12px; display: flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 20px; }
    .logo h1 { font-size: 22px; font-weight: 800;
        background: linear-gradient(135deg, #fff, var(--text-dim));
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .subtitle { text-align: center; color: var(--text-dim); font-size: 11px;
        margin-bottom: 22px; letter-spacing: 0.5px; text-transform: uppercase; }

    .tabs { display: flex; gap: 6px; background: var(--panel-2);
        padding: 4px; border-radius: 12px; margin-bottom: 18px; }
    .tab { flex: 1; padding: 10px; background: transparent; border: none;
        border-radius: 8px; color: var(--text-dim); cursor: pointer;
        font-weight: 600; font-size: 13px; font-family: inherit; transition: all 0.2s; }
    .tab.active { color: #fff;
        background: linear-gradient(135deg, var(--accent), var(--accent-p)); }

    .field { margin-bottom: 12px; }
    input { width: 100%; padding: 12px 14px; background: var(--panel-2);
        border: 1px solid var(--border); border-radius: 10px; color: #fff;
        font-size: 14px; font-family: inherit; outline: none; transition: all 0.2s; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,108,255,0.15); }

    .btn { width: 100%; padding: 12px; border: none; border-radius: 10px;
        font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit;
        transition: all 0.2s; display: flex; align-items: center;
        justify-content: center; gap: 8px; }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-p));
        color: #fff; box-shadow: 0 4px 20px rgba(91,108,255,0.4); margin-bottom: 10px; }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(91,108,255,0.6); }
    .btn-secondary { background: var(--panel-2); color: var(--text);
        border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--accent); }
    .btn-danger { background: linear-gradient(135deg, #6B1F3A, #A03058); color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .status { text-align: center; font-size: 13px; margin-top: 10px;
        min-height: 18px; opacity: 0; transition: opacity 0.3s; }
    .status.show { opacity: 1; }
    .status.error { color: var(--error); }
    .status.success { color: var(--success); }
    .status.info { color: var(--accent); }

    .user-header { display: flex; align-items: center; gap: 12px;
        padding: 14px; background: var(--panel-2); border-radius: 12px;
        margin-bottom: 16px; border: 1px solid var(--border); }
    .avatar { width: 44px; height: 44px; border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), var(--accent-p));
        display: flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 18px; }
    .user-name { font-weight: 700; font-size: 15px; }
    .user-status { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

    .section { font-size: 11px; color: var(--text-dim); text-transform: uppercase;
        letter-spacing: 0.8px; margin: 16px 0 8px; font-weight: 600; }
    .section::after { content: ''; display: block; height: 1px;
        background: linear-gradient(90deg, var(--border), transparent); margin-top: 6px; }

    .key-box { background: var(--panel-2); border: 1px solid var(--border);
        border-radius: 10px; padding: 12px; text-align: center; margin-bottom: 10px;
        font-family: 'Courier New', monospace; font-size: 14px;
        color: var(--success); word-break: break-all; user-select: all; }

    .user-list { max-height: 300px; overflow-y: auto; }
    .user-row { display: flex; justify-content: space-between; align-items: center;
        padding: 10px 12px; background: var(--panel-2); border: 1px solid var(--border);
        border-radius: 10px; margin-bottom: 6px; font-size: 13px; }
    .badge { font-size: 9px; padding: 2px 6px; border-radius: 4px;
        font-weight: 700; text-transform: uppercase; margin-left: 6px; }
    .badge-ok { background: rgba(58,214,138,0.2); color: var(--success); }
    .badge-wait { background: rgba(255,184,76,0.2); color: var(--warn); }
    .badge-admin { background: rgba(157,78,221,0.2); color: var(--accent-p); }
    .mini { padding: 5px 10px; font-size: 11px; border: none; border-radius: 6px;
        cursor: pointer; font-weight: 600; font-family: inherit; margin-left: 4px; }
    .mini-approve { background: var(--success); color: #0A0818; }
    .mini-revoke { background: #D63A6E; color: #fff; }
    .mini-danger { background: #6B1F3A; color: #fff; }

    .back-btn { position: absolute; top: 14px; left: 14px;
        width: 30px; height: 30px; border-radius: 8px;
        background: var(--panel-2); border: 1px solid var(--border);
        color: var(--text-dim); cursor: pointer; font-size: 14px; }
    .back-btn:hover { background: var(--accent); color: #fff; }

    .loader { display: inline-block; width: 14px; height: 14px;
        border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
        border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div>

<!-- АВТОРИЗАЦИЯ -->
<div class="screen active" id="authScreen">
    <div class="panel">
        <div class="logo">
            <div class="logo-icon">A</div>
            <h1>AffitCrash</h1>
        </div>
        <p class="subtitle">Лицензия на мод</p>

        <div class="tabs">
            <button class="tab active" id="tabLogin">Вход</button>
            <button class="tab" id="tabReg">Регистрация</button>
        </div>

        <div class="field"><input id="username" placeholder="Имя пользователя"></div>
        <div class="field"><input id="password" type="password" placeholder="Пароль"></div>

        <button class="btn btn-primary" id="authBtn">
            <span id="authBtnText">Войти</span>
        </button>
        <p class="status" id="status"></p>
    </div>
</div>

<!-- КАБИНЕТ -->
<div class="screen" id="cabinetScreen">
    <div class="panel" style="max-width: 520px;">
        <button class="back-btn" onclick="logout()">←</button>
        <div class="logo">
            <div class="logo-icon">A</div>
            <h1>AffitCrash</h1>
        </div>

        <div class="user-header">
            <div class="avatar" id="avatar">?</div>
            <div>
                <div class="user-name" id="cabUser">user</div>
                <div class="user-status" id="cabStatus">Пользователь</div>
            </div>
        </div>

        <div class="section">Твой лицензионный ключ</div>
        <div class="key-box" id="licenseKey">—</div>
        <button class="btn btn-secondary" onclick="copyKey()" style="margin-bottom:10px;">📋 Копировать</button>

        <!-- === ЛАУНЧЕР === -->
        <div class="section">Клиент</div>
        <button class="btn btn-primary" onclick="downloadLauncher()" style="margin-bottom:10px;">
            🖥 Скачать лаунчер
        </button>

        <div class="section">Смена пароля</div>
        <div class="field"><input id="newPassword" type="password" placeholder="Новый пароль"></div>
        <button class="btn btn-primary" id="changePassBtn">Сменить пароль</button>

        <div id="adminBlock" style="display:none;">
            <div class="section">Админ-панель</div>
            <button class="btn btn-secondary" onclick="loadUsers()" style="margin-bottom:8px;">🔄 Обновить список</button>
            <div class="user-list" id="userList"></div>
        </div>

        <div class="section">Сессия</div>
        <button class="btn btn-danger" onclick="logout()">Выйти</button>
        <p class="status" id="cabStatusMsg"></p>
    </div>
</div>

<script>
// ⚠️ ЗАМЕНИ НА СВОЙ URL
const SERVER_URL = "https://affitcrash-server.onrender.com";
const LAUNCHER_DOWNLOAD_URL = "https://www.dropbox.com/scl/fi/n6h9yhepnvojyeud0j6us/AffitCrash_v1-1.exe?rlkey=b8l98wxzs51aho87tbq3v9nu9&st=v5983mna&dl=1";

let currentToken = null;
let currentUser = null;
let isRegister = false;

function $(id) { return document.getElementById(id); }

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
}

function setStatus(id, msg, type = '') {
    const el = $(id);
    el.textContent = msg;
    el.className = 'status show ' + type;
    if (msg) setTimeout(() => el.classList.remove('show'), 5000);
}

$('tabLogin').onclick = () => {
    isRegister = false;
    $('tabLogin').classList.add('active');
    $('tabReg').classList.remove('active');
    $('authBtnText').textContent = 'Войти';
};

$('tabReg').onclick = () => {
    isRegister = true;
    $('tabReg').classList.add('active');
    $('tabLogin').classList.remove('active');
    $('authBtnText').textContent = 'Зарегистрироваться';
};

$('authBtn').onclick = async () => {
    const u = $('username').value.trim();
    const p = $('password').value;

    if (!u || !p) return setStatus('status', 'Заполни все поля', 'error');
    if (u.length < 3) return setStatus('status', 'Имя короткое', 'error');
    if (p.length < 4) return setStatus('status', 'Пароль короткий', 'error');

    const btn = $('authBtn');
    btn.disabled = true;
    $('authBtnText').innerHTML = '<span class="loader"></span>';

    try {
        const endpoint = isRegister ? '/api/auth/register' : '/api/auth/login';
        const r = await fetch(SERVER_URL + endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p }),
        });
        const data = await r.json();

        if (!data.success) {
            setStatus('status', data.error || 'Ошибка', 'error');
            return;
        }

        if (isRegister) {
            setStatus('status', data.message, 'success');
            if (data.licenseKey) {
                setTimeout(() => {
                    $('tabLogin').click();
                    setStatus('status', 'Теперь войди', 'info');
                }, 1500);
            }
        } else {
            currentToken = data.token;
            currentUser = data.user;
            sessionStorage.setItem('ac_token', currentToken);
            sessionStorage.setItem('ac_user', JSON.stringify(currentUser));
            setStatus('status', 'Успешно!', 'success');
            setTimeout(showCabinet, 400);
        }
    } catch (e) {
        setStatus('status', 'Ошибка сети', 'error');
    } finally {
        btn.disabled = false;
        $('authBtnText').textContent = isRegister ? 'Зарегистрироваться' : 'Войти';
    }
};

function showCabinet() {
    showScreen('cabinetScreen');
    $('cabUser').textContent = currentUser.username;
    $('avatar').textContent = currentUser.username[0].toUpperCase();
    $('cabStatus').textContent = currentUser.role === 'admin' ? 'Администратор' : 'Пользователь';
    $('licenseKey').textContent = currentUser.licenseKey || '—';

    if (currentUser.role === 'admin') {
        $('adminBlock').style.display = 'block';
        loadUsers();
    }
}

// === СКАЧИВАНИЕ ЛАУНЧЕРА ===
function downloadLauncher() {
    window.open(LAUNCHER_DOWNLOAD_URL, '_blank');
    setStatus('cabStatusMsg', '📥 Начинается скачивание лаунчера...', 'info');
}

function copyKey() {
    navigator.clipboard.writeText(currentUser.licenseKey);
    setStatus('cabStatusMsg', '✔ Ключ скопирован', 'success');
}

$('changePassBtn').onclick = async () => {
    const np = $('newPassword').value;
    if (!np || np.length < 4) return setStatus('cabStatusMsg', 'Короткий пароль', 'error');

    try {
        const r = await fetch(SERVER_URL + '/api/auth/change-password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + currentToken,
            },
            body: JSON.stringify({ newPassword: np }),
        });
        const data = await r.json();
        setStatus('cabStatusMsg', data.message || data.error, data.success ? 'success' : 'error');
        if (data.success) $('newPassword').value = '';
    } catch (e) {
        setStatus('cabStatusMsg', 'Ошибка сети', 'error');
    }
};

async function loadUsers() {
    const list = $('userList');
    list.innerHTML = 'Загрузка...';

    try {
        const r = await fetch(SERVER_URL + '/api/admin/users', {
            headers: { 'Authorization': 'Bearer ' + currentToken },
        });
        const data = await r.json();

        if (!data.success) {
            list.innerHTML = '<div style="color:#FF5C7A;">' + (data.error || 'Ошибка') + '</div>';
            return;
        }

        list.innerHTML = '';
        data.users.forEach(u => {
            const row = document.createElement('div');
            row.className = 'user-row';

            const badges = `
                ${u.approved ? '<span class="badge badge-ok">OK</span>' : '<span class="badge badge-wait">WAIT</span>'}
                ${u.role === 'admin' ? '<span class="badge badge-admin">ADMIN</span>' : ''}
            `;

            row.innerHTML = `<div><b>${u.username}</b>${badges}</div>`;

            const actions = document.createElement('div');

            if (u.username !== currentUser.username) {
                const approveBtn = document.createElement('button');
                approveBtn.className = 'mini ' + (u.approved ? 'mini-revoke' : 'mini-approve');
                approveBtn.textContent = u.approved ? 'Забрать' : 'Выдать';
                approveBtn.onclick = () => adminAction('/api/admin/approve', { username: u.username, approved: !u.approved });
                actions.appendChild(approveBtn);

                const roleBtn = document.createElement('button');
                roleBtn.className = 'mini mini-approve';
                roleBtn.textContent = u.role === 'admin' ? 'Снять админа' : 'Сделать админом';
                roleBtn.onclick = () => adminAction('/api/admin/set-role', { username: u.username, role: u.role === 'admin' ? 'user' : 'admin' });
                actions.appendChild(roleBtn);

                const delBtn = document.createElement('button');
                delBtn.className = 'mini mini-danger';
                delBtn.textContent = '🗑';
                delBtn.onclick = () => { if (confirm('Удалить ' + u.username + '?')) adminAction('/api/admin/delete', { username: u.username }); };
                actions.appendChild(delBtn);
            }

            row.appendChild(actions);
            list.appendChild(row);
        });
    } catch (e) {
        list.innerHTML = '<div style="color:#FF5C7A;">Ошибка загрузки</div>';
    }
}

async function adminAction(endpoint, body) {
    try {
        const r = await fetch(SERVER_URL + endpoint, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + currentToken,
            },
            body: JSON.stringify(body),
        });
        const data = await r.json();
        setStatus('cabStatusMsg', data.success ? '✔ Готово' : (data.error || 'Ошибка'),
            data.success ? 'success' : 'error');
        loadUsers();
    } catch (e) {
        setStatus('cabStatusMsg', 'Ошибка сети', 'error');
    }
}

function logout() {
    currentToken = null;
    currentUser = null;
    sessionStorage.removeItem('ac_token');
    sessionStorage.removeItem('ac_user');
    showScreen('authScreen');
}

window.addEventListener('load', () => {
    const t = sessionStorage.getItem('ac_token');
    const u = sessionStorage.getItem('ac_user');
    if (t && u) {
        currentToken = t;
        currentUser = JSON.parse(u);
        showCabinet();
    }
});
</script>
</body>
</html>
